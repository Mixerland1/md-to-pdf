name: Compare with VS Code Markdown PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['benchmark/**', 'src/**', 'pyproject.toml', '.github/workflows/benchmark.yml']
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core xvfb
      - run: python -m pip install '.[test]'
      - run: python benchmark/fixtures.py work
      - run: python benchmark/run_local.py work/md
      - run: npm install --prefix benchmark/vscode
      - run: xvfb-run -a node benchmark/vscode/runner.js work/vscode
      - run: python benchmark/compare.py work
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-results
          path: work/
