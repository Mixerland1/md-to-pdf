name: macOS portable build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build and validate app
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MD-to-PDF-macOS-${{ matrix.arch }}
          path: MD-to-PDF-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
