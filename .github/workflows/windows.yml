name: Desktop builds and release
on:
  workflow_dispatch:
  push:
    branches: [main, 'develop/v0.3.0', 'develop/v0.4.0']
    paths: ['src/**', 'tests/**', 'packaging/**', 'scripts/**', 'examples/**', 'pyproject.toml', '.github/workflows/windows.yml', '.github/workflows/macos.yml']
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-libffi
      - shell: msys2 {0}
        run: echo "MSYS_PREFIX=$(cygpath -w /ucrt64)" >> "$GITHUB_ENV"
      - shell: pwsh
        run: ./packaging/build_windows.ps1 -MsysPrefix $env:MSYS_PREFIX
      - uses: actions/upload-artifact@v4
        with:
          name: MD-to-PDF-Windows-x64
          path: MD-to-PDF-Windows-x64.zip
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Build and validate app
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MD-to-PDF-macOS-${{ matrix.arch }}
          path: MD-to-PDF-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
  publish:
    if: ${{ always() && needs.windows.result == 'success' && (github.ref == 'refs/heads/develop/v0.4.0' || (github.ref == 'refs/heads/main' && needs.macos.result == 'success')) }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MD-to-PDF-*
          merge-multiple: true
          path: release-assets
      - name: Publish all verified desktop bundles together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
          tag="v$version"
          flags=()
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]] || exit 0
            flags+=(--prerelease --latest=false)
          fi
          cd release-assets
          test -s MD-to-PDF-Windows-x64.zip
          cp "../docs/RELEASE_$version.md" /tmp/md-to-pdf-release-notes.md
          for file in MD-to-PDF-macOS-arm64.zip MD-to-PDF-macOS-x86_64.zip; do
            if [[ ! -s "$file" ]]; then
              [[ "$GITHUB_REF" != refs/heads/main ]] || exit 1
              printf '\n%s was not published: platform build or verification failed.\n' "$file" >> /tmp/md-to-pdf-release-notes.md
            fi
          done
          sha256sum MD-to-PDF-*.zip > SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; bump version for new binaries."
          else
            gh release create "$tag" MD-to-PDF-*.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "MD to PDF $tag" --notes-file /tmp/md-to-pdf-release-notes.md "${flags[@]}"
          fi
