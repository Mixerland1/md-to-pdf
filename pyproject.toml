[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-pdf"
version = "0.3.1"
description = "Local document converter and brand style studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "ISC"}
dependencies = ["mistune>=3.2,<4", "weasyprint>=68,<69", "mammoth>=1.11,<2", "bleach>=6,<7"]

[project.optional-dependencies]
test = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
gui = ["tkinterdnd2>=0.4,<1"]
build = ["tkinterdnd2>=0.4,<1", "pyinstaller>=6.11,<7"]


[project.scripts]
md-to-pdf = "md_to_pdf.cli:main"

[project.gui-scripts]
md-to-pdf-gui = "md_to_pdf.gui:main"

[tool.setuptools.package-data]
md_to_pdf = ["print.css", "templates/*.css", "templates/*.svg", "fonts/*.ttf", "fonts/*-OFL.txt"]
